# Generated: 128 peers on UDP 41000-41127, 1 container(s).
# Regenerate with: ./gen-compose.py -n 128
services:
  responder0:
    image: udx-fanout-responder
    build: .
    network_mode: host
    restart: unless-stopped
    environment:
      UDX_PORTS: "41000-41127"
      PEER_PREFIX: "peer"
      SILENCE_PROBE_S: "0"
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}
